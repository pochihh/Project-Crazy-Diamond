<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heart Phantom</title>
<style>
:root {
  color-scheme: light dark;
  --paper: #fffdf4; --ink: #252c28; --muted: #555e56; --line: #b7b9aa;
  --plot: #f5f4e8; --green: #355f42; --active: #dfebdb; --accent: #244f89;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color: var(--ink); background: var(--paper); font: 13px/1.45 var(--mono);
  font-variant-numeric: tabular-nums;
}
@media(prefers-color-scheme:dark){
  :root { --paper:#2a302a; --ink:#f1f0e3; --muted:#c0c7b9; --line:#667163;
    --plot:#242b24; --green:#b9dfbd; --active:#344d3a; --accent:#a6c8f2 }
}
* { box-sizing: border-box }
html.embedded { overflow: clip }
body,h2,p { margin: 0 }
#panel-content { display: flow-root; padding: 14px 16px; overflow-wrap: anywhere }
.head,.actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.head { justify-content: space-between; padding-bottom: 8px; border-bottom: 2px solid var(--ink) }
h2 { font: 700 23px/1.15 Georgia,"Times New Roman",serif; letter-spacing: -.035em }
#status { font-size: 11px; color: var(--green) }
.body { display: grid; grid-template-columns: minmax(140px,1fr) minmax(0,2fr); gap: 16px; padding-top: 12px }
.body>div { min-width: 0 }
.fields { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px 10px }
label { display: grid; gap: 3px; font-size: 11px; align-content: end }
input,select,button { min-width: 0; max-width: 100%; color: var(--ink); font: inherit; font-size: 12px; padding: 5px 7px; border: 1px solid var(--ink); border-radius: 0; background: var(--paper) }
button { font-weight: 600; cursor: pointer; padding: 6px 10px }
button:hover:enabled { border-color: var(--accent); color: var(--accent) }
button:disabled { opacity: .48; cursor: not-allowed }
:where(input,select,button,summary):focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
#start { background: var(--active); color: var(--green) }
.actions,details { margin-top: 10px }
.fine,#reference-note,#message { font-size: 11px; line-height: 1.55; color: var(--muted) }
p:not(:empty) { margin-top: 6px }
#message { white-space: pre-wrap }
#reference-note.warning { color: var(--ink); border-inline-start: 3px solid #bb8633; padding-inline-start: 7px }
canvas { display: block; width: 100%; height: 160px; border: 1px solid var(--line); background: var(--plot) }
[hidden] { display: none !important }
@media(max-width:650px){
  .body { grid-template-columns: 1fr }
  .scene { display: none }
  .fields { grid-template-columns: repeat(2,minmax(0,1fr)) }
}
@media(max-width:430px){ #panel-content { padding: 10px } }
</style>
<script>if (window.parent !== window) document.documentElement.classList.add('embedded');</script>
<main id="panel-content"><div class="head"><h2>Heart Phantom</h2><span id="status">CONNECTING</span></div><div class="body"><div class="scene"><canvas id="xy" aria-label="Measured two-axis position"></canvas><p class="fine">Measured XY / mm</p></div><div><div class="fields"><label>Input<select id="source"><option value="sine">Two-axis sine</option><option value="csv">Saved CSV</option></select></label><label>Completion<select id="completion"><option value="loop">Loop</option><option value="hold">Hold final values</option><option value="stop">Stop and save</option></select></label><label class="sine">Period / s<input id="period" type="number" value="2" min=".001" max="300" step="any"></label><label class="sine">Axis 0 amplitude / mm<input id="a0" type="number" value="1" min="0" step="any"></label><label class="sine">Axis 1 amplitude / mm<input id="a1" type="number" value="1" min="0" step="any"></label><label class="sine">Relative phase / °<input id="phase" type="number" value="0" step="any"></label><label class="sine">Axis 0 center / mm<input id="o0" type="number" value="0" step="any"></label><label class="sine">Axis 1 center / mm<input id="o1" type="number" value="0" step="any"></label><label class="sine">Approach speed / mm/s<input id="approach" type="number" value="5" min="0.001" step="any"></label><label class="sine">DO0 pulse / ms<input id="pulse" type="number" value="5" min="0" step=".5"></label></div><div id="csv-fields" hidden><div class="actions"><label>File on Pi<select id="file"></select></label><button id="refresh">REFRESH FILES</button></div><details><summary>Upload a new CSV (optional)</summary><input id="upload" type="file" accept=".csv,text/csv"><label><span><input id="replace" type="checkbox"> Replace an existing file of the same name</span></label></details><p class="fine">Columns: axis0_reference_mm, axis1_reference_mm, do0. One row = 0.5 ms.</p></div><div class="actions"><button id="start">START + RECORD</button><button id="stop">STOP + SAVE</button><span class="fine" id="recording">—</span></div><p class="fine sine">Start slowly returns both axes to zero, then begins recording and the sine. Both waveform first samples must be zero.</p><p id="reference-note" role="status"></p><p id="message" role="status"></p></div></div></main>
<script type="module">
if (window.parent !== window) {
  const content = document.getElementById('panel-content');
  const reportHeight = () => {
    const height = Math.ceil(Math.max(content.scrollHeight, content.getBoundingClientRect().height));
    if (height) window.parent.postMessage({type:'pcd.panel.size', height}, '*');
  };
  new ResizeObserver(reportHeight).observe(content, {box:'border-box'});
  window.addEventListener('load',reportHeight);
}
const revision = new URLSearchParams(location.search).get('pcd_rev');
const {numberText,referenceNote} = await import('./reference.js' + (revision ? '?pcd_rev='+encodeURIComponent(revision) : ''));
const el=id=>document.getElementById(id);let busy=false,loaded=false,lastConfig='',requestId=0;
async function json(url,body){const r=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');return d}
function source(){const sine=el('source').value==='sine';document.querySelectorAll('.sine').forEach(x=>x.hidden=!sine);el('csv-fields').hidden=sine}
el('source').onchange=source;
async function files(){const d=await json('/files'),selected=el('file').value;el('file').replaceChildren(...d.names.map(n=>new Option(n,n)));if(d.names.includes(selected))el('file').value=selected;loaded=true}
el('refresh').onclick=()=>files().catch(e=>el('message').textContent=e.message);
async function send(operation){const id=++requestId;busy=true;el('start').disabled=true;el('message').textContent=operation==='start'?'Preparing experiment…':'Stopping…';try{let body={operation};if(operation==='start'){body={...body,source:el('source').value,completion:el('completion').value,period_s:Number(el('period').value),amplitude_mm:[Number(el('a0').value),Number(el('a1').value)],offset_mm:[Number(el('o0').value),Number(el('o1').value)],phase_deg:Number(el('phase').value),pulse_width_ms:Number(el('pulse').value),approach_speed_mm_s:Number(el('approach').value),filename:el('file').value};const file=el('upload').files[0];if(body.source==='csv'&&file){body.filename=file.name;body.csv=await file.text();body.overwrite=el('replace').checked}}const r=await json('/command',body);if(id!==requestId)return;el('message').textContent=r.message||(operation==='stop'?'Stopped; associated recording saved.':'Started.');if(operation==='start'){el('upload').value='';await files()}}catch(e){if(id===requestId)el('message').textContent=e.message}finally{if(id===requestId)busy=false}}
el('start').onclick=()=>send('start');el('stop').onclick=()=>send('stop');
function config(c){if(!c.source)return;el('source').value=c.source;el('completion').value=c.completion||'loop';el('period').value=numberText(c.period_s);el('a0').value=numberText(c.amplitude_mm[0]);el('a1').value=numberText(c.amplitude_mm[1]);el('o0').value=numberText(c.offset_mm[0]);el('o1').value=numberText(c.offset_mm[1]);el('phase').value=numberText(c.phase_deg);el('pulse').value=numberText(c.pulse_width_ms);el('approach').value=numberText(c.approach_speed_mm_s??5);if(c.filename)el('file').value=c.filename;source()}
function plotColors() {
  const style=getComputedStyle(document.documentElement);
  return {grid:style.getPropertyValue('--line'),mark:style.getPropertyValue('--green'),font:style.getPropertyValue('--mono')};
}
let panelColors=plotColors();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{panelColors=plotColors()});
async function poll(){try{if(!loaded)await files();const d=await json('/state'),s=d.bridge;const active=s.runner_state===1||s.runner_state===2;el('status').textContent=(s.fault||d.phase||['READY','RUNNING','HOLDING','COMPLETE','STOPPED / FAULT'][s.runner_state]||'WAITING')+` · cycle ${s.runner_cycles||0}`;el('recording').textContent=s.recording?`REC · ${s.recorded_samples} samples`:(s.recording_file||'No recording');el('start').disabled=busy||d.busy||active||s.recording||!s.connected||!!s.fault;const c=JSON.stringify(d.configuration);if(c!==lastConfig&&!busy){config(d.configuration);lastConfig=c}const note=referenceNote(s.controllers,el('source').value,Number(el('period').value),[Number(el('a0').value),Number(el('a1').value)]);el('reference-note').textContent=note.text;el('reference-note').classList.toggle('warning',note.limited);const canvas=el('xy'),ctx=canvas.getContext('2d'),w=Math.round(canvas.clientWidth*devicePixelRatio),h=Math.round(canvas.clientHeight*devicePixelRatio);if(canvas.width!==w)canvas.width=w;if(canvas.height!==h)canvas.height=h;ctx.clearRect(0,0,w,h);ctx.strokeStyle=panelColors.grid;ctx.beginPath();ctx.moveTo(w/2,0);ctx.lineTo(w/2,h);ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();const x=s.position_mm?.[0]||0,y=s.position_mm?.[1]||0,extent=Math.max(2,Math.abs(x)*1.3,Math.abs(y)*1.3);ctx.fillStyle=panelColors.mark;ctx.beginPath();ctx.arc(w/2+x/extent*w*.4,h/2-y/extent*h*.4,5*devicePixelRatio,0,2*Math.PI);ctx.fill();ctx.font=`${11*devicePixelRatio}px ${panelColors.font}`;ctx.fillText(`${numberText(Number(x.toFixed(2)))}, ${numberText(Number(y.toFixed(2)))} mm`,8*devicePixelRatio,18*devicePixelRatio)}catch(e){el('status').textContent='UNAVAILABLE';el('start').disabled=true}finally{setTimeout(poll,200)}}poll();
</script></html>
